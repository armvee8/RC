[build-system]
requires = ["setuptools>=61"]

[project]
name = "invisible-unicode-cli"
version = "1.0"
description = "A command line tool that allows you to encode a string into invisible unicode or generate a certain amount of unicode bytes."
requires-python = ">=3.9"
authors = [ 
    { name = "Vee" } 
] 

[project.scripts]
invisible_text = "cli:main"

[tool.setuptools]
py-modules = ["cli", "encoder"]
